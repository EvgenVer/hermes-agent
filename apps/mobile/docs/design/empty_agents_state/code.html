<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hermes Mobile — No agents</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--surface:#182238;--text:#f8fafc;--muted:#a8b4c9;--line:#33415d;--amber:#ffdda2;--green:#55dc87;--orange:#ffc061}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}.topbar{min-height:56px;padding:max(4px,env(safe-area-inset-top)) 16px 4px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.topbar h1{flex:1;margin:0;font-size:19px;color:var(--amber)}.chip{padding:7px 10px;border:1px solid #286a4a;border-radius:99px;color:var(--green);font-size:12px}.main{width:min(100%,412px);margin:auto;min-height:calc(100dvh - 56px);padding:24px 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}.card{text-align:center;padding:28px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.mark{width:80px;height:80px;margin:0 auto 20px;display:grid;place-items:center;border:1px solid var(--line);border-radius:22px;background:#202b43;color:var(--amber);font-size:34px}.eyebrow{margin:0 0 8px;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.card h2{margin:0;font-size:26px;line-height:1.2}.card p{margin:12px auto 0;max-width:310px;color:var(--muted);font-size:15px}.actions{display:grid;gap:10px;margin-top:24px}.actions button{width:100%;min-height:52px;border-radius:10px;font:inherit;font-weight:700}.primary{border:0;background:var(--amber);color:#412d00}.secondary{border:1px solid #70809c;background:transparent;color:var(--text)}.secondary:disabled{opacity:.55}.status{margin-top:16px;color:var(--muted);font-size:13px}.status strong{color:var(--orange)}
</style>
<style id="dark-only-theme">:root{color-scheme:dark}html,body{background:#0b1220!important;color:#e6eef2!important}body :where(main,header,section,article,aside,nav,footer,form,div,details,summary,figure,fieldset,pre,table,tbody,tr,td,iframe){background-color:#121d2d!important}body :where(h1,h2,h3,h4,h5,h6,strong,b){color:#f5f8fa!important}body :where(p,label,small,span,li,time,figcaption){color:#afbec7!important}body :where(a){color:#8fd8c0!important}body :where(input,textarea,select){background:#0f1a29!important;color:#eef4f7!important;border-color:#41536a!important}body :where(input,textarea,select)::placeholder{color:#8298a5!important}body :where(button,.button,.btn){background:#1b2a3e!important;color:#eef4f7!important;border:1px solid #41536a!important}body :where(.primary,.button.primary,.btn.primary,.send,.submit,.connect){background:#1f6f5b!important;color:#fff!important;border-color:#63c7a5!important}body :where(.danger,.button.danger,.btn.danger,.destructive){background:#4a2829!important;color:#ffd8d4!important;border-color:#a95a56!important}body :where(.notice,.scope,.banner){background:#182c3a!important;color:#c5dbe3!important}body :where(.badge,.success,.connected,.online,.done){background:#17352d!important;color:#8fe0c1!important}body :where(.warn,.warning,.unknown,.outcome,.oauth){background:#332a18!important;color:#ffdda2!important}body :where(.error,.invalid){background:#4a2829!important;color:#ffd8d4!important}body :where(.avatar,.icon,.mark){background:#183b35!important;color:#9fe4c9!important}body :where(.shade){background:#000b!important}</style><style id="dark-only-specific">body .screen,body .tag{background:#1b2a3e!important;color:#dce8eb!important;border-color:#41536a!important}body .panel,body .flow,body .item{background:#121d2d!important;color:#dce8eb!important}body .framewrap{background:#18283a!important}body .frame{background:#0f1a29!important}body .selected{color:#8fd8c0!important}</style></head>
<body>
<header class="topbar"><h1>Hermes Mobile</h1><span class="chip">● Connected</span></header>
<main class="main" aria-labelledby="screen-title"><section class="card"><div class="mark" aria-hidden="true">⌂</div><p class="eyebrow">A02 · Empty agents</p><h2 id="screen-title">No agents yet</h2><p>Agent profiles are created and managed on the Hermes server. Create the first profile to begin.</p><div class="actions"><button class="primary" type="button">＋ Create agent</button><button class="secondary" type="button" disabled>Clone an agent</button></div><p class="status"><strong>No clone source available.</strong><br>The clone action becomes available after a profile is confirmed by the server.</p></section></main>
</body>
</html>
